lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

catalogs:
  default:
    '@actions/core':
      specifier: ^3.0.1
      version: 3.0.1

importers:

  .:
    devDependencies:
      '@eslint/js':
        specifier: ^10.0.1
        version: 10.0.1(eslint@10.6.0)
      eslint:
        specifier: ^10.6.0
        version: 10.6.0
      eslint-plugin-security:
        specifier: ^4.0.0
        version: 4.0.1
      globals:
        specifier: ^15.0.0
        version: 15.15.0

  packages/action:
    dependencies:
      '@actions/core':
        specifier: 'catalog:'
        version: 3.0.1
      '@anansikey/core':
        specifier: workspace:*
        version: link:../core
      anansikey:
        specifier: workspace:*
        version: link:../cli

  packages/chaos:
    dependencies:
      '@anansikey/core':
        specifier: workspace:*
        version: link:../core

  packages/cli:
    dependencies:
      '@anansikey/core':
        specifier: workspace:*
        version: link:../core
    optionalDependencies:
      '@aws-sdk/client-secrets-manager':
        specifier: ^3.700.0
        version: 3.1076.0

  packages/core: {}

  packages/vscode:
    dependencies:
      '@anansikey/core':
        specifier: workspace:*
        version: link:../core
    devDependencies:
      '@types/vscode':
        specifier: ^1.90.0
        version: 1.125.0
      '@vscode/vsce':
        specifier: ^2.0.0
        version: 2.32.0

  packages/web:
    dependencies:
      '@anansikey/core':
        specifier: workspace:*
        version: link:../core
    devDependencies:
      esbuild:
        specifier: ^0.28.1
        version: 0.28.1

