<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>anansikey — validate api credentials</title>
<meta name="description" content="Validate API credentials locally. Keys never leave your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* ── Reset ──────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 13px; }

/* ── Variables ──────────────────────────────────────────── */
:root {
  --bg:        #060d1a;
  --bg-raised: #0a1525;
  --bg-input:  #081120;
  --border:    #0d1f3a;
  --border-hi: #1a3a6a;
  --text:      #c8d8f0;
  --text-dim:  #4a6080;
  --text-mid:  #7a9abf;
  --accent:    #3d8ef0;
  --green:     #00e87a;
  --red:       #ff4757;
  --amber:     #ffd32a;
  --mono:      'IBM Plex Mono', 'Fira Code', 'Cascadia Code', monospace;
}

/* ── Base ───────────────────────────────────────────────── */
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
  font-size: 1rem;
  line-height: 1.6;
  min-height: 100vh;
}

/* ── Layout ─────────────────────────────────────────────── */
.shell {
  max-width: 860px;
  margin: 0 auto;
  padding: 0 20px;
}

/* ── Header ─────────────────────────────────────────────── */
header {
  border-bottom: 1px solid var(--border);
  padding: 18px 0 16px;
  display: flex;
  align-items: baseline;
  gap: 20px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
}

.logo-mark {
  width: 28px;
  height: 28px;
  flex-shrink: 0;
}

.logo-name {
  font-size: 15px;
  font-weight: 500;
  color: var(--text);
  letter-spacing: 0.02em;
}

.logo-name span { color: var(--accent); }

.header-meta {
  font-size: 11px;
  color: var(--text-dim);
  margin-left: auto;
}

.header-meta a {
  color: var(--text-dim);
  text-decoration: none;
  margin-left: 16px;
}
.header-meta a:hover { color: var(--text-mid); }

/* ── Main two-column layout ─────────────────────────────── */
.workspace {
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 0;
  min-height: calc(100vh - 62px);
}

/* ── Sidebar: service picker ────────────────────────────── */
.sidebar {
  border-right: 1px solid var(--border);
  padding: 20px 0;
  position: sticky;
  top: 0;
  height: calc(100vh - 62px);
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

.sidebar-section {
  margin-bottom: 6px;
}

.sidebar-category {
  font-size: 10px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  padding: 10px 20px 4px;
}

.service-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 6px 20px;
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text-mid);
  font-family: var(--mono);
  font-size: 12px;
  text-align: left;
  transition: background 0.08s, color 0.08s;
}

.service-btn:hover {
  background: var(--border);
  color: var(--text);
}

.service-btn.active {
  background: var(--bg-raised);
  color: var(--accent);
  border-right: 2px solid var(--accent);
}

.service-btn .svc-icon { font-size: 14px; width: 18px; text-align: center; }
.service-btn .svc-name { flex: 1; }
.service-btn .svc-status {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--border-hi);
  flex-shrink: 0;
}
.service-btn .svc-status.ok     { background: var(--green); }
.service-btn .svc-status.fail   { background: var(--red); }
.service-btn .svc-status.warn   { background: var(--amber); }

/* ── Main area ──────────────────────────────────────────── */
.main {
  padding: 24px 28px;
  display: flex;
  flex-direction: column;
  gap: 0;
}

/* ── Breadcrumb ─────────────────────────────────────────── */
.breadcrumb {
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.breadcrumb span { color: var(--text-mid); }

/* ── Service header ─────────────────────────────────────── */
.service-header {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 20px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}

.service-icon-lg { font-size: 28px; line-height: 1; margin-top: 2px; }

.service-title h2 {
  font-size: 15px;
  font-weight: 500;
  color: var(--text);
  margin-bottom: 3px;
}

.service-title .docs-link {
  font-size: 11px;
  color: var(--text-dim);
  text-decoration: none;
}
.service-title .docs-link:hover { color: var(--accent); }

/* ── Form fields ────────────────────────────────────────── */
.fields { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }

.field { display: flex; flex-direction: column; gap: 5px; }

.field label {
  font-size: 11px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.field input {
  background: var(--bg-input);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: var(--mono);
  font-size: 12px;
  padding: 9px 12px;
  outline: none;
  transition: border-color 0.12s;
  width: 100%;
}

.field input:focus { border-color: var(--accent); }
.field input::placeholder { color: var(--text-dim); }

.field input.error  { border-color: var(--red); }
.field input.ok     { border-color: var(--green); }
.field input.warn   { border-color: var(--amber); }

/* ── Submit button ──────────────────────────────────────── */
.btn-validate {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 20px;
  background: none;
  border: 1px solid var(--accent);
  color: var(--accent);
  font-family: var(--mono);
  font-size: 12px;
  cursor: pointer;
  transition: background 0.1s, color 0.1s;
  letter-spacing: 0.03em;
  user-select: none;
}

.btn-validate:hover:not(:disabled) {
  background: var(--accent);
  color: var(--bg);
}

.btn-validate:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.btn-validate .spinner {
  width: 10px; height: 10px;
  border: 1.5px solid currentColor;
  border-top-color: transparent;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  display: none;
}

.btn-validate.loading .spinner { display: block; }
.btn-validate.loading .btn-label { display: none; }

@keyframes spin { to { transform: rotate(360deg); } }

/* ── Result panel ───────────────────────────────────────── */
.result-panel {
  margin-top: 20px;
  border: 1px solid var(--border);
  background: var(--bg-input);
  font-size: 12px;
  display: none;
}

.result-panel.visible { display: block; }

.result-bar {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 11px;
}

.result-bar.ok   { border-left: 3px solid var(--green); }
.result-bar.fail { border-left: 3px solid var(--red);   }
.result-bar.warn { border-left: 3px solid var(--amber); }

.result-icon { font-size: 13px; font-weight: 500; }
.result-icon.ok   { color: var(--green); }
.result-icon.fail { color: var(--red);   }
.result-icon.warn { color: var(--amber); }

.result-msg   { color: var(--text); flex: 1; }
.result-code  { color: var(--text-dim); font-size: 10px; }

.result-body {
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.result-row {
  display: flex;
  gap: 10px;
  font-size: 11px;
  line-height: 1.5;
}

.result-row .rk { color: var(--text-dim); min-width: 70px; flex-shrink: 0; }
.result-row .rv { color: var(--text); word-break: break-all; }
.result-row .rv.dim { color: var(--text-mid); }
.result-row .rv.fix { color: var(--amber); }

/* ── P1 notice ──────────────────────────────────────────── */
.p1-notice {
  padding: 8px 14px;
  border-top: 1px solid var(--border);
  font-size: 10px;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ── Scan .env panel ────────────────────────────────────── */
.scan-panel { display: none; }
.scan-panel.active { display: block; }

.scan-area {
  background: var(--bg-input);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: var(--mono);
  font-size: 11px;
  padding: 12px;
  width: 100%;
  min-height: 160px;
  resize: vertical;
  outline: none;
  transition: border-color 0.12s;
  line-height: 1.7;
}

.scan-area:focus { border-color: var(--accent); }
.scan-area::placeholder { color: var(--text-dim); }

.scan-results {
  margin-top: 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.scan-row {
  display: grid;
  grid-template-columns: 20px 140px 1fr auto;
  gap: 10px;
  align-items: baseline;
  font-size: 11px;
  padding: 6px 10px;
  border: 1px solid var(--border);
  background: var(--bg-raised);
}

.scan-row .sr-icon { text-align: center; }
.scan-row .sr-name { color: var(--text-mid); }
.scan-row .sr-msg  { color: var(--text); }
.scan-row .sr-key  { color: var(--text-dim); text-align: right; font-size: 10px; }

.scan-row.ok   { border-left: 2px solid var(--green); }
.scan-row.fail { border-left: 2px solid var(--red);   }
.scan-row.warn { border-left: 2px solid var(--amber); }

/* ── Tab switcher ───────────────────────────────────────── */
.tabs {
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: 20px;
}

.tab-btn {
  padding: 8px 16px;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text-dim);
  font-family: var(--mono);
  font-size: 11px;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: -1px;
  transition: color 0.1s;
}

.tab-btn.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

.tab-btn:hover:not(.active) { color: var(--text-mid); }

/* ── Stats bar ──────────────────────────────────────────── */
.stats-bar {
  display: flex;
  gap: 0;
  border-top: 1px solid var(--border);
  padding-top: 16px;
  margin-top: auto;
}

.stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding-right: 24px;
}

.stat-val {
  font-size: 18px;
  font-weight: 500;
  color: var(--text);
  line-height: 1;
}

.stat-val.green { color: var(--green); }
.stat-val.red   { color: var(--red);   }
.stat-val.amber { color: var(--amber); }

.stat-lbl {
  font-size: 10px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

/* ── Principles sidebar ─────────────────────────────────── */
.principles {
  border-top: 1px solid var(--border);
  padding: 16px 20px 0;
  margin-top: 20px;
}

.principles p {
  font-size: 10px;
  color: var(--text-dim);
  line-height: 1.8;
  margin-bottom: 4px;
}

.principles p strong {
  color: var(--text-mid);
  font-weight: 400;
}

/* ── Welcome state ──────────────────────────────────────── */
.welcome {
  color: var(--text-dim);
  font-size: 12px;
  line-height: 2;
  padding: 20px 0;
}

.welcome .cmd {
  color: var(--accent);
  display: block;
  margin-top: 6px;
}

/* ── Scrollbar ──────────────────────────────────────────── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-hi); }

/* ── Responsive ─────────────────────────────────────────── */
@media (max-width: 640px) {
  .workspace { grid-template-columns: 1fr; }
  .sidebar {
    height: auto;
    position: static;
    border-right: none;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    overflow-y: hidden;
    padding: 12px 0;
  }
  .sidebar-section { display: inline-flex; white-space: nowrap; }
  .sidebar-category { display: none; }
  .service-btn { padding: 6px 12px; }
}
</style>

<script type="module">
// ── Import core providers + browser adapter ───────────────────
// In production: these are bundled. In dev: loaded from relative path.
// For this single-file version: providers are inlined below.

// ── Mask helper [P6] ─────────────────────────────────────────
function maskSecret(value) {
  if (value == null || value === '') return '••••••••';
  const s = String(value), len = s.length;
  if (len <= 8) return '••••••••';
  const head = Math.min(4, Math.floor(len * 0.15));
  const tail = Math.min(4, Math.floor(len * 0.15));
  return s.slice(0, head) + '••••••••' + s.slice(len - tail);
}

// ── Result constructors ───────────────────────────────────────
const ok      = (msg, detail='') => ({ type:'success', msg, detail });
const fail    = (code, msg, fix='') => ({ type:'error', code, msg, fix });
const warn    = (code, msg, fix='') => ({ type:'warn', code, msg, fix });
const malformed = (status) => fail('MALFORMED_RESPONSE',
  `API returned unparseable response (HTTP ${status})`,
  'The provider API may have changed — check github.com/anansikey/anansikey/issues');

// ── Browser HTTP adapter [P1][P8] ─────────────────────────────
async function request(descriptor) {
  const { hostname, path, method='GET', headers={}, port=443, body=null } = descriptor;
  const url = `https://${hostname}${port !== 443 ? ':' + port : ''}${path}`;
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 10000);
  try {
    const res = await fetch(url, {
      method,
      signal: controller.signal,
      headers: { 'Accept': 'application/json', 'Content-Type': 'application/json', ...headers },
      ...(body ? { body } : {}),
    });
    const raw = await res.text();
    let parsed;
    try { parsed = JSON.parse(raw); }
    catch { parsed = { _raw: raw, _malformed: true }; }
    return { status: res.status, body: parsed, raw };
  } catch(e) {
    if (e.name === 'AbortError') throw new Error('TIMEOUT');
    if (e.message?.toLowerCase().includes('cors') || e.message?.toLowerCase().includes('fetch'))
      throw new Error('CORS');
    throw e;
  } finally { clearTimeout(timer); }
}

function netErr(e) {
  const m = e?.message ?? '';
  if (m.includes('TIMEOUT'))
    return fail('TIMEOUT', 'Request timed out (10s)', 'Check your connection and try again');
  if (m.includes('CORS') || m.includes('fetch'))
    return fail('CORS_BLOCK', 'Request blocked by browser CORS policy',
      'Use the CLI for this provider — it has no CORS restrictions\n$ anansikey check ' + (window._activeProvider?.id ?? 'stripe'));
  return fail('NETWORK_ERROR', `Network error: ${m}`, 'Check your internet connection');
}

// ── Provider registry (browser version) ──────────────────────
// Shape: { id, name, icon, category, fields, env_vars, docs, format, request, parse }

const PROVIDERS = [

{ id:'stripe', name:'Stripe', icon:'💳', category:'Payments',
  docs:'https://dashboard.stripe.com/apikeys',
  fields:[{name:'secret_key',label:'Secret Key',placeholder:'sk_test_...'}],
  env_vars:['STRIPE_SECRET_KEY'],
  format({secret_key}){
    const k=secret_key?.trim()??'';
    if(!k) return fail('MISSING_KEY','Secret key is required');
    if(k.startsWith('pk_test_')||k.startsWith('pk_live_'))
      return fail('FORMAT_ERROR','This is a PUBLISHABLE key — use the SECRET key (sk_...)');

// ── Env var → provider map ────────────────────────────────────
const ENV_MAP = {};
for (const p of PROVIDERS)
  for (const ev of p.env_vars ?? [])
    (ENV_MAP[ev] = ENV_MAP[ev] ?? []).push(p);

function detectServices(vars) {
  const found = new Map();
  for (const [key, val] of Object.entries(vars)) {
    for (const provider of (ENV_MAP[key] ?? [])) {
      if (!found.has(provider.id)) found.set(provider.id, { provider, creds: {} });
      // Map env var → field name
      const field = provider.fields.length === 1
        ? provider.fields[0].name
        : provider.fields.find(f => key.toLowerCase().includes(f.name.toLowerCase()))?.name;
      if (field) found.get(provider.id).creds[field] = val;
    }
  }
  return [...found.values()].filter(({ provider, creds }) =>
    provider.fields.every(f => creds[f.name] != null)
  );
}

async function runProvider(provider, creds) {
  const fmt = provider.format(creds);
  if (fmt) return fmt;
  const desc = provider.request(creds);
  try {
    const res = await request(desc);
    return provider.parse(res.status, res.body, creds);
  } catch (e) { return netErr(e); }
}

let _active = null;
window._activeProvider = null;

function selectProvider(provider) {
  _active = provider;
  window._activeProvider = provider;

  // Update sidebar selection
  document.querySelectorAll('.service-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.id === provider.id);
  });

  // Breadcrumb
  document.querySelector('.breadcrumb span').textContent = provider.name;

  // Service header
  document.getElementById('svc-icon').textContent = provider.icon;
  document.getElementById('svc-name').textContent  = provider.name;
  const docsLink = document.getElementById('svc-docs');
  docsLink.href = provider.docs;
  docsLink.textContent = `→ ${new URL(provider.docs).hostname}`;

  // Build fields
  const container = document.getElementById('fields-container');
  container.innerHTML = '';
  for (const field of provider.fields) {
    const div = document.createElement('div');
    div.className = 'field';
    div.innerHTML = `
      <label for="field-${field.name}">${field.label}</label>
      <input id="field-${field.name}"
             type="text"
             name="${field.name}"
             autocomplete="off"
             autocorrect="off"
             spellcheck="false"
             placeholder="${field.placeholder}">`;
    container.appendChild(div);
  }

  // Reset result
  const panel = document.getElementById('result-panel');
  panel.className = 'result-panel';
  panel.querySelectorAll('input').forEach(i => { i.className = ''; });

  // Show service view
  document.getElementById('welcome-state').style.display = 'none';
  document.getElementById('service-view').style.display  = 'block';

  // Focus first field
  setTimeout(() => container.querySelector('input')?.focus(), 0);
}

// ── Validate single ──────────────────────────────────────────
document.getElementById('btn-validate').addEventListener('click', async () => {
  if (!_active) return;

  const btn = document.getElementById('btn-validate');
  const creds = {};
  for (const field of _active.fields) {
    creds[field.name] = document.getElementById(`field-${field.name}`)?.value ?? '';
  }

  // Loading state
  btn.classList.add('loading');
  btn.disabled = true;

  const result = await runProvider(_active, creds);

  btn.classList.remove('loading');
  btn.disabled = false;

  showResult(result, creds);

  // Update sidebar dot
  const dot = document.getElementById(`dot-${_active.id}`);
  if (dot) dot.className = `svc-status ${result.type === 'success' ? 'ok' : result.type === 'warn' ? 'warn' : 'fail'}`;
});

function showResult(result, creds) {
  const panel = document.getElementById('result-panel');
  const bar   = document.getElementById('result-bar');
  const icon  = document.getElementById('result-icon');
  const msg   = document.getElementById('result-msg');
  const code  = document.getElementById('result-code');
  const body  = document.getElementById('result-body');

  const type = result.type;
  const cls  = type === 'success' ? 'ok' : type === 'warn' ? 'warn' : 'fail';

  bar.className   = `result-bar ${cls}`;
  icon.className  = `result-icon ${cls}`;
  icon.textContent = type === 'success' ? '✓' : type === 'warn' ? '⚠' : '✗';
  msg.textContent  = result.msg;
  code.textContent = result.code ?? '';

  body.innerHTML = '';

  if (result.detail) {
    for (const line of result.detail.split('\n')) {
      const [k, ...rest] = line.split(':');
      if (rest.length) {
        body.insertAdjacentHTML('beforeend',
          `<div class="result-row"><span class="rk">${k.trim()}</span><span class="rv">${rest.join(':').trim()}</span></div>`);
      }
    }
  }

  if (result.fix) {
    const lines = result.fix.split('\n');
    body.insertAdjacentHTML('beforeend',
      `<div class="result-row"><span class="rk">fix</span><span class="rv fix">${lines[0]}</span></div>`);
  }

  // Colour field borders
  if (_active) {
    for (const field of _active.fields) {
      const input = document.getElementById(`field-${field.name}`);
      if (input) input.className = cls;
    }
  }

  panel.className = 'result-panel visible';
}

// ── Scan .env ─────────────────────────────────────────────────
function parseEnv(text) {
  const vars = {};
  for (const raw of text.split('\n')) {
    const line = raw.trim();
    if (!line || line.startsWith('#')) continue;
    const eq = line.indexOf('=');
    if (eq < 1) continue;
    const key = line.slice(0, eq).trim();
    let   val = line.slice(eq + 1).trim();
    if ((val.startsWith('"') && val.endsWith('"')) ||
        (val.startsWith("'") && val.endsWith("'")))
      val = val.slice(1, -1);
    if (key) vars[key] = val;
  }
  return vars;
}

document.getElementById('btn-scan').addEventListener('click', async () => {
  const text = document.getElementById('scan-input').value.trim();
  if (!text) return;

  const vars     = parseEnv(text);
  const detected = detectServices(vars);
  const hint     = document.getElementById('scan-hint');
  const results  = document.getElementById('scan-results');
  const btn      = document.getElementById('btn-scan');

  if (!detected.length) {
    hint.textContent = 'no recognized credential keys found';
    results.innerHTML = '';
    return;
  }

  hint.textContent = `${detected.length} service(s) detected`;
  results.innerHTML = '';
  btn.classList.add('loading');
  btn.disabled = true;

  for (let i = 0; i < detected.length; i++) {
    const { provider, creds } = detected[i];

    // Placeholder row while loading
    const row = document.createElement('div');
    row.className = 'scan-row';
    row.innerHTML = `
      <span class="sr-icon">${provider.icon}</span>
      <span class="sr-name">${provider.name}</span>
      <span class="sr-msg" style="color:var(--text-dim)">testing...</span>
      <span class="sr-key">${maskSecret(Object.values(creds)[0]??'')}</span>`;
    results.appendChild(row);

    const result = await runProvider(provider, creds);
    const cls    = result.type === 'success' ? 'ok' : result.type === 'warn' ? 'warn' : 'fail';
    const icon   = result.type === 'success' ? '✓' : result.type === 'warn' ? '⚠' : '✗';

    row.className = `scan-row ${cls}`;
    row.querySelector('.sr-icon').textContent = icon;
    row.querySelector('.sr-msg').textContent  = result.msg;
    row.querySelector('.sr-msg').style.color  = '';

    // Update sidebar dot
    const dot = document.getElementById(`dot-${provider.id}`);
    if (dot) dot.className = `svc-status ${cls}`;

    if (i < detected.length - 1) await new Promise(r => setTimeout(r, 500)); // [P7]
  }

  btn.classList.remove('loading');
  btn.disabled = false;
  hint.textContent = `${detected.length} service(s) validated`;
});

// ── Breadcrumb init ──────────────────────────────────────────
document.querySelector('.breadcrumb').innerHTML =
  `anansikey / validate / <span>select a service</span>`;
</script>
</body>
</html>
