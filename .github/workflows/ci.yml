name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # ── 1. Verify ────────────────────────────────────────────────
  # Cheapest checks first, so a lint or format error fails in seconds
  # instead of after the 200-scenario chaos suite.
  verify:
    name: Lint, SAST, audit, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint + eslint-plugin-security)
        run: pnpm run lint

      - name: Core zero-dependency check (manifest level)
        run: pnpm run check:core-zero-deps

      - name: SAST (provider source rules)
        run: pnpm run sast

      - name: Dependency audit
        run: pnpm audit --audit-level=high

      - name: OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml

      # Unit tests: real cryptographic primitives (SigV4, Pusher HMAC,
      # Apple ES256, VAPID ECDH) checked against published worked examples.
      - name: Unit tests
        run: pnpm run test:unit

      # Most expensive: every provider against every failure mode.
      - name: Chaos suite
        run: pnpm run chaos

      - name: Stripe deep chaos
        run: pnpm run chaos:stripe

      - name: Build web app (bundles the real @anansikey/core, no duplication)
        run: pnpm run build:web

      - name: Web bundle purity (no node:crypto leaked into the browser build)
        run: pnpm run verify:web-bundle-purity

  # ── 2. Smoke tests — the four consumers of packages/core ─────
  smoke:
    name: CLI / VS Code / Action smoke tests
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      # ── CLI ──────────────────────────────────────────────────
      - name: CLI help / list
        run: |
          node packages/cli/index.js help
          node packages/cli/index.js list

      # Exit codes are the CLI's contract with CI pipelines, so they are
      # asserted exactly — not just "non-zero". No network is involved:
      # an invalid format is rejected by format() before request().
      - name: CLI exits 3 on invalid format (never 9 = internal crash)
        run: |
          set +e
          node packages/cli/index.js check stripe --secret_key=INVALID_FORMAT >/dev/null 2>&1
          EXIT=$?
          set -e
          echo "exit=$EXIT"
          [ "$EXIT" = "3" ] || { echo "✗ expected exit 3 (FORMAT_ERROR), got $EXIT"; exit 1; }

      - name: CLI exits 3 on missing key
        run: |
          set +e
          node packages/cli/index.js check github >/dev/null 2>&1
          EXIT=$?
          set -e
          echo "exit=$EXIT"
          [ "$EXIT" = "3" ] || { echo "✗ expected exit 3 (MISSING_KEY), got $EXIT"; exit 1; }

      - name: CLI scaffold generates a provider skeleton
        run: |
          node packages/cli/index.js scaffold --name=TestProvider
          [ -f providers/testprovider.js ] || { echo "✗ scaffold produced no file"; exit 1; }
          node --check providers/testprovider.js
          rm -rf providers/
          echo "✓ scaffold output is syntactically valid"

      # ── VS Code extension ────────────────────────────────────
      - name: VS Code extension logic
        run: |
          node --input-type=module << 'VSTEST'
          import path from 'node:path';
          import { detectServices } from './packages/core/index.node.js';

          // Mirrors isEnvFile() in packages/vscode/src/extension.js
          const isEnvFile = (n) => {
            const base = path.basename(n);
            return base === '.env' || base.startsWith('.env.') ||
              base.endsWith('.env') || /\.env\.\w+$/.test(base);
          };

          const cases = [
            ['.env', true], ['.env.local', true], ['.env.production', true],
            ['index.js', false], ['package.json', false],
          ];
          for (const [file, want] of cases) {
            if (isEnvFile(file) !== want) { console.error('FAIL isEnvFile', file); process.exit(1); }
          }

          const detected = detectServices({
            STRIPE_SECRET_KEY: 'sk_test_' + 'a'.repeat(40),
            GITHUB_TOKEN: 'ghp_' + 'b'.repeat(36),
          });
          if (detected.length !== 2) { console.error('FAIL detectServices:', detected.length); process.exit(1); }

          console.log('✓ VS Code extension logic tests passed');
          VSTEST

      # ── GitHub Action ────────────────────────────────────────
      - name: Action worstExit logic
        run: |
          node --input-type=module << 'ACTIONTEST'
          import { ResultType, ExitCode, exitCodeFor } from './packages/core/results/index.js';

          const results = [
            { type: ResultType.SUCCESS },
            { type: ResultType.ERROR, code: 'AUTH_FAILED' },
            { type: ResultType.WARN,  code: 'LOW_BALANCE' },
          ];
          let worst = ExitCode.OK;
          for (const r of results) {
            const code = exitCodeFor(r);
            if (code !== ExitCode.WARNING && code > worst) worst = code;
          }
          if (worst !== 1) { console.error('FAIL worstExit:', worst); process.exit(1); }

          console.log('✓ GitHub Action logic tests passed');
          ACTIONTEST

      # End-to-end run of the real entrypoint. Format-invalid values on
      # purpose: the run must stay entirely offline and must never exit 9.
      - name: Action entrypoint end-to-end
        run: |
          printf 'STRIPE_SECRET_KEY=INVALID_FORMAT\nGITHUB_TOKEN=not_a_token\n' > .env.ci-smoke
          set +e
          INPUT_ENV_FILE=.env.ci-smoke node packages/action/entrypoint.js
          EXIT=$?
          set -e
          rm -f .env.ci-smoke
          echo "exit=$EXIT"
          [ "$EXIT" != "0" ] || { echo "✗ invalid credentials must not pass"; exit 1; }
          [ "$EXIT" != "9" ] || { echo "✗ internal crash (exit 9)"; exit 1; }
          echo "✓ action entrypoint handled invalid credentials without crashing"
